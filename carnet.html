<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet Digital · Unisalamanca</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan-dark:  #0369a1;
      --cyan:       #0ea5e9;
      --cyan-light: #38bdf8;
      --off-white:  #f0f9ff;
      --muted:      #64748b;
      --border:     #bae6fd;
      --success:    #22c55e;
      --text-dark:  #0c1a2e;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 50%, #075985 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    /* Verified */
    .verified-banner {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 100px;
      padding: 0.45rem 1.2rem;
      margin-bottom: 1.4rem;
      animation: fadeIn 0.5s ease;
    }
    .verified-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    .verified-banner span {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--success);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.5;transform:scale(1.4)}
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp {
      from{transform:translateY(30px);opacity:0}
      to{transform:translateY(0);opacity:1}
    }

    /* Carnet */
    .carnet {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.2),
        0 30px 80px rgba(0,0,0,0.3);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
    }

    /* Carnet header */
    .carnet-header {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 70%);
      padding: 1.4rem 1.6rem 1.1rem;
      position: relative;
      overflow: hidden;
    }
    .carnet-header::before {
      content:''; position:absolute;
      top:-35px; right:-35px;
      width:130px; height:130px;
      border-radius:50%;
      background:rgba(255,255,255,0.08);
    }
    .carnet-header::after {
      content:''; position:absolute;
      bottom:-20px; left:30%;
      width:200px; height:60px;
      border-radius:50%;
      background:rgba(255,255,255,0.06);
    }

    /* Logo en carnet */
    .carnet-logo { position:relative; z-index:1; margin-bottom:0.5rem; overflow:hidden; }
    .carnet-logo .uni {
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .carnet-logo .uni span { color: rgba(255,255,255,0.55); }
    .carnet-logo .corp {
      font-family: 'Syne', sans-serif;
      font-size: 0.48rem;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 0.1rem;
    }

    .carnet-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      position: relative;
      z-index: 1;
    }
    .carnet-sub {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      position: relative;
      z-index: 1;
      margin-top: 0.15rem;
    }

    /* Stripe */
    .stripe {
      height: 4px;
      background: linear-gradient(90deg, var(--cyan-light), #fff 50%, var(--cyan-light));
    }

    /* Body */
    .carnet-body {
      padding: 1.4rem 1.6rem;
      display: flex;
      gap: 1.1rem;
      align-items: center;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-light));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 6px 20px rgba(14,165,233,0.35);
      text-transform: uppercase;
    }
    .info-block { flex: 1; }
    .field { margin-bottom: 0.75rem; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      font-size: 0.58rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 0.12rem;
    }
    .field-value {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.2;
    }
    .field-value.code {
      font-size: 0.85rem;
      color: var(--cyan-dark);
      letter-spacing: 0.5px;
    }
    .field-value.program {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--cyan-dark);
      font-family: 'DM Sans', sans-serif;
      opacity: 0.8;
    }

    /* Footer */
    .carnet-footer {
      border-top: 1px solid var(--border);
      background: var(--off-white);
      padding: 0.8rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--success);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    .vigencia { font-size: 0.65rem; color: var(--muted); }

    /* Error */
    .error-state { display:none; text-align:center; padding:2rem; }
    .error-state.visible { display:block; }
    .error-state h2 {
      font-family:'Syne',sans-serif;
      font-size:1.1rem; font-weight:700;
      color:#fff; margin-bottom:0.5rem;
    }
    .error-state p { color:rgba(255,255,255,0.5); font-size:0.85rem; }

    /* Back */
    .back-link { margin-top:1.5rem; text-align:center; }
    .back-link a {
      color:rgba(255,255,255,0.35);
      font-size:0.78rem; text-decoration:none;
      font-family:'Syne',sans-serif;
      transition:color 0.2s;
    }
    .back-link a:hover { color:#fff; }
  </style>
</head>
<body>

  <div class="error-state" id="error-state">
    <div style="font-size:3rem;margin-bottom:1rem">⚠️</div>
    <h2>QR Inválido</h2>
    <p>Este código no contiene datos de carnet válidos.</p>
  </div>

  <div class="verified-banner" id="verified-banner">
    <div class="verified-dot"></div>
    <span>✓ Carnet Verificado</span>
  </div>

  <div class="carnet" id="carnet">
    <div class="carnet-header">
      <div class="carnet-logo">
        <div class="uni">Uni<span>Salamanca</span></div>
        <div class="corp">Corporación Universitaria Empresarial</div>
      </div>
      <div class="carnet-title">Carnet Estudiantil</div>
      <div class="carnet-sub" id="vigencia-text"></div>
    </div>
    <div class="stripe"></div>
    <div class="carnet-body">
      <div class="avatar" id="avatar-text">?</div>
      <div class="info-block">
        <div class="field">
          <div class="field-label">Nombre Completo</div>
          <div class="field-value" id="val-nombre">—</div>
        </div>
        <div class="field">
          <div class="field-label">Código Estudiantil</div>
          <div class="field-value code" id="val-codigo">—</div>
        </div>
        <div class="field">
          <div class="field-label">Programa Académico</div>
          <div class="field-value program" id="val-programa">—</div>
        </div>
      </div>
    </div>
    <div class="carnet-footer">
      <span class="status-badge"><span class="status-dot"></span>Activo</span>
      <span class="vigencia" id="vigencia-footer"></span>
    </div>
  </div>

  <div class="back-link">
    <a href="index.html">← Volver al generador</a>
  </div>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const nombre   = params.get('nombre');
    const codigo   = params.get('codigo');
    const programa = params.get('programa');

    if (!nombre || !codigo || !programa) {
      document.getElementById('error-state').classList.add('visible');
      document.getElementById('verified-banner').style.display = 'none';
      document.getElementById('carnet').style.display = 'none';
    } else {
      const partes    = nombre.split(' ');
      const iniciales = (partes[0][0] + (partes[1] ? partes[1][0] : '')).toUpperCase();
      const anio      = new Date().getFullYear();
      const vigencia  = `Vigencia: ${anio} – ${anio + 1}`;

      document.getElementById('val-nombre').textContent    = nombre;
      document.getElementById('val-codigo').textContent    = codigo;
      document.getElementById('val-programa').textContent  = programa;
      document.getElementById('avatar-text').textContent   = iniciales;
      document.getElementById('vigencia-text').textContent = vigencia;
      document.getElementById('vigencia-footer').textContent = vigencia;
      document.title = `Carnet · ${nombre} · Unisalamanca`;
    }
  </script>
</body>
</html>
