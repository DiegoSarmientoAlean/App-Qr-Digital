<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet Digital · Unisalamanca</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ══ HEADER ══ -->
  <header>
    <h1>Carnet <span>Digital</span></h1>
    <p>Unisalamanca · Sistema de Identificación con QR</p>
  </header>

  <!-- ══ FORMULARIO ══ -->
  <div class="panel active" id="panel-generar">

    <div class="form-card" id="form-section">
      <div class="form-group">
        <label>Código</label>
        <input type="text" id="inp-codigo" placeholder="Ej: 2024-001234" maxlength="20">
      </div>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="inp-nombre" placeholder="Ej: María García López">
      </div>
      <div class="form-group">
        <label>Programa</label>
        <input type="text" id="inp-programa" placeholder="Ej: Ingeniería de Sistemas">
      </div>
      <button class="btn-generate" onclick="generarCarnet()">Generar Carnet Digital</button>
    </div>

    <!-- Solo QR tras generar -->
    <div id="carnet-output">

      <!-- QR Grande centrado -->
      <div class="qr-grande-section" id="qr-grande-section">
        <div class="qr-label">
          <span class="qr-name-badge" id="qr-name-badge"></span>
          <p>📱 Escanea con la cámara de tu celular</p>
        </div>
        <div id="qrcode-grande"></div>
        <div class="qr-actions">
          <a class="btn-download-qr" id="btn-download-qr" download="carnet-qr.png">⬇ Descargar QR</a>
          <button class="btn-nuevo" onclick="nuevoCarnet()">✕ Nuevo Carnet</button>
        </div>
      </div>

      <!-- String URL (colapsado, útil para debug) -->
      <div class="qr-string-box">
        <p>🔗 URL codificada en el QR</p>
        <code id="qr-string-value"></code>
      </div>

      <!-- Carnet completo OCULTO (solo para referencia interna, no se muestra) -->
      <div style="display:none">
        <div id="carnet-avatar"></div>
        <div id="carnet-nombre"></div>
        <div id="carnet-codigo"></div>
        <div id="carnet-programa"></div>
        <div id="carnet-vigencia"></div>
        <div id="carnet-id-mini"></div>
        <div id="qrcode-display"></div>
      </div>

    </div><!-- /#carnet-output -->

  </div><!-- /#panel-generar -->

  <script src="app.js"></script>
</body>
</html>
